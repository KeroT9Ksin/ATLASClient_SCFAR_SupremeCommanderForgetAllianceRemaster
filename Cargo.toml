[package]
name = "atlas_client"
version = "0.0.2"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
zip = "2"
# LuaJIT (64-bit, GC64 на x86_64) с семантикой Lua 5.1.
# "vendored" собирает LuaJIT из исходников — нужен C-компилятор (MSVC/g++).
mlua = { version = "0.10", features = ["luajit", "vendored", "serialize"] }

[profile.release]
opt-level = 2